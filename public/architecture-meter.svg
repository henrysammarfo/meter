<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="METER architecture flow">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#122033"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8F542"/>
      <stop offset="100%" stop-color="#7CFFB2"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <text x="48" y="52" fill="#C8F542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="3">METER · TRACK A</text>
  <text x="48" y="98" fill="#F4F7FA" font-family="Georgia, 'Times New Roman', serif" font-size="36">Fund ? 402 ? settle ? receipt ? invoice ? cap</text>
  <text x="48" y="132" fill="#9AA7B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16">Shared ledger truth for agent?agent API spend. No mocks.</text>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <rect x="48" y="180" width="160" height="88" rx="14" fill="#182636" stroke="#2A3B4F"/>
    <text x="128" y="220" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="600">1. Fund</text>
    <text x="128" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">subaccount + token</text>

    <rect x="248" y="180" width="160" height="88" rx="14" fill="#182636" stroke="#2A3B4F"/>
    <text x="328" y="220" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="600">2. 402</text>
    <text x="328" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">Payment Required</text>

    <rect x="448" y="180" width="160" height="88" rx="14" fill="#1B2D22" stroke="#C8F542"/>
    <text x="528" y="220" text-anchor="middle" fill="#C8F542" font-size="15" font-weight="600">3. Settle</text>
    <text x="528" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">prepaid / x402</text>

    <rect x="648" y="180" width="160" height="88" rx="14" fill="#182636" stroke="#2A3B4F"/>
    <text x="728" y="220" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="600">4. Receipt</text>
    <text x="728" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">shared hash/id</text>

    <rect x="848" y="180" width="160" height="88" rx="14" fill="#182636" stroke="#2A3B4F"/>
    <text x="928" y="220" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="600">5. Invoice</text>
    <text x="928" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">A2A rollup</text>

    <rect x="1048" y="180" width="104" height="88" rx="14" fill="#182636" stroke="#2A3B4F"/>
    <text x="1100" y="220" text-anchor="middle" fill="#F4F7FA" font-size="15" font-weight="600">6. Cap</text>
    <text x="1100" y="244" text-anchor="middle" fill="#9AA7B8" font-size="12">$20/day</text>
  </g>

  <g stroke="url(#signal)" stroke-width="2" fill="none">
    <path d="M208 224 H248"/>
    <path d="M408 224 H448"/>
    <path d="M608 224 H648"/>
    <path d="M808 224 H848"/>
    <path d="M1008 224 H1048"/>
  </g>

  <text x="48" y="330" fill="#C8F542" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">LIVE PROVIDERS</text>
  <text x="48" y="358" fill="#F4F7FA" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15">Tavily · TinyFish Search/Fetch · optional AgentRouter LLM · Flovia ledger</text>
  <text x="48" y="390" fill="#9AA7B8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Deletion test: wipe the ledger ? shared receipts/invoices vanish. Payments elsewhere stay, truth does not.</text>
</svg>
